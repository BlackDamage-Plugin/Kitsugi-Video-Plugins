name: HDCH Kotlin Doğrulama

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/hdfc-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK lisansları
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Derle ve test et
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :HDFilmCehennemi:testDebugUnitTest > /tmp/build.log 2>&1
          STATUS=$?
          echo "çıkış=$STATUS"
          {
            echo "# çıkış=$STATUS"
            echo '```'
            grep -nE "^e: |error:|Unresolved reference|FAILED|expected:|AssertionError|FAILURE:|What went wrong|Caused by:" /tmp/build.log | head -n 120
            echo '```'
            echo
            echo "## log sonu"
            echo '```'
            tail -n 80 /tmp/build.log
            echo '```'
          } > /tmp/report.md
          tail -n 200 /tmp/report.md
          exit 0
      - name: Raporu dala it
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/push && mkdir -p /tmp/push
          cp /tmp/report.md /tmp/push/kotlin-report.md 2>/dev/null || echo "rapor yok" > /tmp/push/kotlin-report.md
          cd /tmp/push
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b hdfc-probe-data
          git add -A
          git commit -qm "kotlin raporu ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:hdfc-probe-data && echo "rapor itildi"
