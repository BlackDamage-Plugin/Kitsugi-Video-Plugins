name: HDCH Kotlin Doğrulama

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  Derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK lisansları
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Derle ve test et
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :HDFilmCehennemi:testDebugUnitTest > /tmp/build.log 2>&1
          STATUS=$?
          set -e
          echo "çıkış=$STATUS"
          echo "::warning::gradle çıkışı $STATUS"
          # Hata satırlarını iş akışı ekine (annotation) yaz: bu ortamdan log indirilemiyor.
          grep -nE "^e: |error:|Unresolved reference|FAILED|expected:|AssertionError|What went wrong|Caused by:|BUILD FAILED" /tmp/build.log \
            | head -n 10 | while IFS= read -r line; do
                clean=$(echo "$line" | tr '"' "'" | cut -c1-900)
                echo "::error::$clean"
              done
          PASSED=$(grep -c "PASSED" /tmp/build.log || true)
          FAILEDN=$(grep -c "FAILED" /tmp/build.log || true)
          echo "::notice::test PASSED=$PASSED FAILED=$FAILEDN"
          grep -E "PASSED|FAILED" /tmp/build.log | head -n 5 | while IFS= read -r line; do
            clean=$(echo "$line" | tr '"' "'" | cut -c1-300)
            echo "::notice::ornek: $clean"
          done
          tail -n 6 /tmp/build.log | while IFS= read -r line; do
            clean=$(echo "$line" | tr '"' "'" | cut -c1-900)
            echo "::notice::$clean"
          done
          exit 0
