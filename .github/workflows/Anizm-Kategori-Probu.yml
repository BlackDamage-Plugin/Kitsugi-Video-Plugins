name: Anizm Kategori Probu

# Kategori satırlarının neden aynı listeyi gösterdiğini ölçer.
# Çıktı hem log'a hem `probe-data` dalına yazılır (artifact indirilemeyen
# ortamlarda da okunabilsin diye).

on:
  push:
    paths:
      - "tools/anizm_category_probe.py"
      - "tools/anizm_home_probe.py"
      - ".github/workflows/Anizm-Kategori-Probu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kategori probu
        run: |
          set +e
          python3 -u tools/anizm_category_probe.py > /tmp/kategori.log 2>&1 || true
          python3 -u tools/anizm_home_probe.py > /tmp/anasayfa.log 2>&1 || true
          cat /tmp/anasayfa.log
          mkdir -p research/anizm-probe
          cp /tmp/kategori.log research/anizm-probe/kategori.log 2>/dev/null || true
          cp /tmp/anasayfa.log research/anizm-probe/anasayfa.log 2>/dev/null || true
          set -e

      - name: Sonucu dal yaz
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/push && mkdir -p /tmp/push
          cp research/anizm-probe/*.log /tmp/push/ 2>/dev/null || true
          cd /tmp/push
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b probe-data
          git add -A
          git commit -qm "anizm kategori olcumu ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-data && echo "probe-data dalına yazıldı"
