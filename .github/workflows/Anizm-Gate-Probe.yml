# Anizm +18 kapısı / kaynak zinciri canlı probu.
#
# Sandbox anizm.net'e doğrudan çıkamıyor (ağ politikası); GitHub runner'ı
# çıkabildiği için ölçüm burada yapılır. İş günlüğü `results-receiver` üzerinden
# indirilemediği için çıktı `research/anizm-probe/probe.log` dosyasına yazılıp
# aynı dala geri itilir; rapor `git pull` ile okunur. Yayınlanan hiçbir şey yok.
name: Anizm Gate Probe

on:
  push:
    branches:
      - arena/b539cd4c-kitsugi-plugins
    paths:
      - "tools/anizm_gate_probe.py"
      - "tools/anizm_resolve_probe.py"
      - "tools/anizm_sistenn_probe.py"
      - ".github/workflows/Anizm-Gate-Probe.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "Bölüm yolu (boşsa varsayılan +18 filmi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  Probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: arena/b539cd4c-kitsugi-plugins
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: pip install --quiet pycryptodome

      - name: Erişim yoklaması (curl)
        continue-on-error: true
        run: |
          mkdir -p research/anizm-probe
          {
            echo "## curl erişimi ($(date -u +%FT%TZ))"
            for u in https://anizm.net/ https://anizm.com.tr/ https://www.puffytr.com/ https://r.jina.ai/https://anizm.net/; do
              printf '%-46s %s\n' "$u" "$(curl -sS -o /dev/null -m 25 -w '%{http_code} %{size_download}B' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/133' "$u" 2>&1 || echo FAIL)"
            done
          } | tee research/anizm-probe/curl.txt

      - name: Anizm +18 kapısı probu
        continue-on-error: true
        run: |
          mkdir -p research/anizm-probe
          ARGS=""
          if [ -n "${{ github.event.inputs.url }}" ]; then ARGS="--url ${{ github.event.inputs.url }}"; fi
          python3 -u tools/anizm_gate_probe.py $ARGS > research/anizm-probe/probe.log 2>&1 || true
          echo "--- son satırlar ---"
          tail -20 research/anizm-probe/probe.log || true

      - name: Anizm referans çözücü probu
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.url }}" ]; then ARGS="--url ${{ github.event.inputs.url }}"; fi
          python3 -u tools/anizm_resolve_probe.py $ARGS > research/anizm-probe/resolve.log 2>&1 || true
          tail -30 research/anizm-probe/resolve.log || true

      - name: Sistenn oynatıcı sözleşmesi
        continue-on-error: true
        run: python3 -u tools/anizm_sistenn_probe.py > research/anizm-probe/sistenn.log 2>&1 || true

      - name: Raporu dala geri yaz
        if: always()
        run: |
          mkdir -p research/anizm-probe
          git config user.name "arena-probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f research/anizm-probe
          git commit -m "probe: anizm +18 kapısı ölçümü" || echo "değişiklik yok"
          for i in 1 2 3; do
            if git push -q origin HEAD:"$BRANCH"; then
              echo "push OK"
              break
            fi
            echo "push reddedildi, rebase deneniyor ($i)"
            git fetch -q origin "$BRANCH"
            git rebase "origin/$BRANCH" || git rebase --abort || true
            sleep 5
          done
