name: Oynatıcı Erişim Probu

on:
  pull_request:
    paths:
      - 'tools/probe_player_access.py'
      - '.github/workflows/Player-Erisim-Probu.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Oynatıcıları kontrol et
        run: python3 tools/probe_player_access.py > /tmp/player-access.md
      - name: Türkiye konumlu erişim yollarını dene
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probe_turkey_player.py >> /tmp/player-access.md 2>&1 || echo 'Türkiye probu hata ile durdu.' >> /tmp/player-access.md
      - name: Kısa süreli oyuncu HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-html-${{ github.run_id }}
          path: site-dump/*.html
          if-no-files-found: warn
          retention-days: 1
      - name: Sonucu PR'a yaz
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file /tmp/player-access.md
