# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: "Derlenecek eklenti dizinleri (boslukla ayrilmis). Bos birakilirsa sadece degisen dizinler derlenir."
        required: false
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 2

      - name: "'build' Depo Kontrolu"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Lisansları
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Degisen Eklentileri Bul ve Derle
        run: |
          exec > >(tee /tmp/kitsugi-cloudstream-publish.log) 2>&1
          cd $GITHUB_WORKSPACE/src

          # enabled_plugins.txt = uygulamada gorunecek TEK kaynaklar.
          # Burada olmayan eklentiler derlenmez; kaynaklari SILINMEZ, sadece devre disi.
          ENABLED=""
          if [ -f enabled_plugins.txt ]; then
            ENABLED=$(grep -vE '^[[:space:]]*(#|$)' enabled_plugins.txt | tr -d '\r' | sed 's/[[:space:]]*$//' || true)
            echo "Aktif eklenti listesi:"; echo "$ENABLED"
          fi

          # Manuel tetiklemede (workflow_dispatch) eklenti listesi elle verilebilir;
          # aksi halde onceki commit ile karsilastirilir. enabled_plugins.txt'ye yeni
          # eklenen pluginleri de degisen listeye ekle; yalnizca listeyi guncellemek
          # yeni .cs3 dosyasinin uretilmeden manifestte kalmasina yol acmamali.
          MANUAL="${{ github.event.inputs.plugins }}"
          if [ -n "$MANUAL" ]; then
            CHANGED="$MANUAL"
            echo "Manuel derleme listesi: $CHANGED"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oP '^[^/]+' | sort -u || true)
            if git diff --name-only HEAD~1 HEAD -- enabled_plugins.txt | grep -qx 'enabled_plugins.txt'; then
              PREVIOUS_ENABLED=$(git show HEAD~1:enabled_plugins.txt 2>/dev/null | grep -vE '^[[:space:]]*(#|$)' | tr -d '\r' | sed 's/[[:space:]]*$//' || true)
              for dir in $ENABLED; do
                if ! printf '%s\n' "$PREVIOUS_ENABLED" | grep -qxF "$dir"; then
                  CHANGED="$CHANGED $dir"
                  echo "Yeni etkinlestirilen plugin derleme listesine eklendi: $dir"
                fi
              done
            fi
            # Yayın iş akışının kendisi değiştiğinde, etkin eklentilerin hepsini
            # derleyerek yeni yayın yolunu gerçek plugin çıktılarıyla sınar.
            if git diff --name-only HEAD~1 HEAD -- .github/workflows/Derleyici.yml | grep -qx '.github/workflows/Derleyici.yml'; then
              CHANGED="$CHANGED $ENABLED"
              echo "Yayın iş akışı değişti; tüm etkin eklentiler yeniden derlenecek."
            fi
            echo "Degisen klasorler: $CHANGED"
          fi

          # 1) Hazir (prebuilt) eklentileri ONCE kopyala.
          #    DIKKAT 1: plugins.json'daki URL'ler `builds/prebuilt/<ad>.cs3` bicimindedir;
          #    bu yuzden kopya hem kok dizine hem `builds/prebuilt/` altina yapilir.
          #    DIKKAT 2: kopyalama SURUM KARSILASTIRMALI yapilir. Eskiden kosulsuz
          #    `cp` kullaniliyordu; derleme yapilmayan bir commit'te builds/ altindaki
          #    taze .cs3 dosyasi prebuilt/ altindaki eski surumle eziliyor ve yayindaki
          #    surum geriye dusuyordu (AnimeciX 23 -> 21). stage_prebuilt.py yalnizca
          #    daha yeni surumu kopyalar.
          python3 tools/stage_prebuilt.py prebuilt "$GITHUB_WORKSPACE/builds"

          # 2) Sadece gercek plugin klasorlerini sec (build.gradle.kts'i olanlar)
          PLUGINS_TO_BUILD=""
          BUILT_DIRS=""
          for dir in $CHANGED; do
            if [ ! -f "$dir/build.gradle.kts" ]; then
              continue
            fi
            if [ -n "$ENABLED" ] && ! printf '%s\n' "$ENABLED" | grep -qxF "$dir"; then
              echo "Devre disi (enabled_plugins.txt'de yok), atlandi: $dir"
              continue
            fi
            PLUGINS_TO_BUILD="$PLUGINS_TO_BUILD :$dir:make"
            BUILT_DIRS="$BUILT_DIRS $dir"
            echo "Derlenecek plugin: $dir"
          done

          if [ -n "$PLUGINS_TO_BUILD" ]; then
            chmod +x gradlew

            # Sadece degisen ve aktif pluginleri derle
            ./gradlew $PLUGINS_TO_BUILD makePluginsJson

            # 2b) Regresyon testleri (varsa) — bozuk kod yayinlanmasin.
            TEST_TASKS=""
            for dir in $BUILT_DIRS; do
              if [ -d "$dir/src/test" ]; then
                TEST_TASKS="$TEST_TASKS :$dir:test"
                echo "Test edilecek: $dir"
              fi
            done
            if [ -n "$TEST_TASKS" ]; then
              ./gradlew $TEST_TASKS
            fi

          # 3) Derleme eskiyse daha yeni yayindaki/prebuilt dosyayi ezme.
          # Ornegin DiziPal kaynak surumu 33 iken Drive'daki paket 102'dir.
          for dir in $BUILT_DIRS; do
            CS3="$dir/build/$dir.cs3"
            if [ ! -f "$CS3" ]; then
              echo "Derleme ciktisi bulunamadi: $CS3"
              exit 1
            fi
            python3 - "$CS3" "$GITHUB_WORKSPACE/builds/$dir.cs3" <<'PY'
          import os, shutil, sys
          from tools.stage_prebuilt import cs3_version

          src, dst = sys.argv[1:]
          src_version = cs3_version(src)
          dst_version = cs3_version(dst) if os.path.exists(dst) else -1
          if src_version < 0:
              raise SystemExit(f"Gecersiz derleme paketi: {src}")
          if src_version >= dst_version:
              shutil.copy2(src, dst)
              print(f"Kopyalandi: {dst} (surum {src_version})")
          else:
              print(f"Daha yeni yayin korundu: {dst} ({dst_version} > {src_version})")
          PY
          done
          else
            # ONEMLI: Derleme olmasa bile manifest yeniden uretilmeli; aksi halde
            # enabled_plugins.txt degisikligi builds/plugins.json'a hic yansimaz
            # (uygulamada eski 166+ eklenti listesi gorunmeye devam eder).
            echo "Derlenecek aktif/degismis plugin yok; sadece manifest guncellenecek."
          fi

          # 4) Manifest guncelle (enabled_plugins.txt filtresi + hash/surum senkronu)
          python3 merge_plugins.py
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          cp build/repo.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yukle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --staged --quiet && echo "Degisiklik yok, push atlanıyor." && exit 0
          git commit --amend -m "$GITHUB_SHA 'nın Derlenmesi"
          git push --force

      # ───────────────────────────────────────────────────────────────────────
      # KRITIK: `builds` dalini amend + force-push ile guncelledigimiz icin
      # jsDelivr eski manifest veya .cs3 dosyalarini onbellekten dondurebilir.
      # Purge API'si HTTP 200 ile throttled yaniti verebildiginden betik hem
      # saglayici sonucunu hem de son aynayi dogrular. Purge dogrulanamazsa
      # yayin isi kirmizi kalir; uygulamada guncel oldugu varsayilmaz.
      - name: "CDN Onbellegini Temizle ve Dogrula (jsDelivr)"
        run: |
          cd $GITHUB_WORKSPACE/src
          python3 tools/purge_cdn.py

      - name: "Yayin hatasini ilgili PR'a yaz"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_FILE=/tmp/kitsugi-cloudstream-publish.log
          if [ ! -f "$LOG_FILE" ] || [ ! -d "$GITHUB_WORKSPACE/src/.git" ]; then
            echo "Yayın günlüğü veya kaynak checkout'u bulunamadı; PR notu atlandı."
            exit 0
          fi

          PR_NUMBER=$(git -C "$GITHUB_WORKSPACE/src" log -1 --format=%B | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p' | head -n 1)
          if [ -z "$PR_NUMBER" ]; then
            echo "Tetikleyen commit bir PR merge'i değil; yalnızca Action günlüğü kullanılabilir."
            exit 0
          fi

          {
            echo "### ❌ CloudStream yayın adımı başarısız"
            echo ""
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "**Hata özeti:**"
            echo '```text'
            grep -nE "^e: |error:|Unresolved reference|Compilation error|FAILURE:|What went wrong|Caused by:|Exception|Error:" "$LOG_FILE" | tail -n 35 || true
            echo '```'
            echo ""
            echo "<details><summary>Son 100 log satırı</summary>"
            echo ""
            echo '```text'
            tail -n 100 "$LOG_FILE"
            echo '```'
            echo "</details>"
          } > /tmp/kitsugi-cloudstream-publish-failure.md

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/kitsugi-cloudstream-publish-failure.md || echo "PR'a yorum yazılamadı."
